name: Supabase Daily Backup to Cloudflare R2

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (03:00 AM hora de Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar el backup manualmente desde la interfaz de GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Backup con pg_dump
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILE="backups/gestion_jc_${TIMESTAMP}.sql.gz"
          
          # Realiza el volcado y lo comprime
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges | gzip > "$BACKUP_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "Archivo generado con éxito: $BACKUP_FILE"

      - name: Subir Backup a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Sube el archivo usando el endpoint de Cloudflare R2 compatible con S3
          aws s3 cp "$BACKUP_FILE" \
            "s3://${{ secrets.R2_BUCKET_NAME }}/$(basename $BACKUP_FILE)" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
